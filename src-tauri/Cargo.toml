[package]
name = "stremio-accru"
version = "0.1.0"
description = "Stremio Accru — platform-agnostic Kai (Tauri + stremio-core + MPV)"
authors = ["Stremio Accru"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/cernoh/stremio-accru"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["full"] }
dirs = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
async-trait = "0.1"

[features]
default = []
desktop-player = []
