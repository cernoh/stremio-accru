# Stremio Accru — portable MPV baseline (derived from Kai mpv.conf)
# All paths use ~~ / resource-relative; see docs/PLAN.md §2.3.
log-file=LOG.txt

# OSD
osd-font=Nata Sans
osd-font-size=40
osd-color=0.0/0.0/0.0/1.0
osd-outline-size=1.5
osd-outline-color=1.0/1.0/1.0/1.0
osd-blur=0.1
osd-align-x=center
osd-bar=no
osd-margin-y=50
osd-duration=3000
osd-scale-by-window=yes

# Cache (optimized for streaming)
gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc
cache=yes
cache-secs=900
demuxer-readahead-secs=180
demuxer-max-back-bytes=512MiB
demuxer-max-bytes=1024MiB
stream-buffer-size=128MiB
demuxer-seekable-cache=yes
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5

# Subs
sub-font='Nata Sans'
sub-font-size=48
sub-bold=yes
sub-border-size=0.5
sub-shadow-offset=1.3
sub-margin-y=0
sub-use-margins=yes
embeddedfonts=yes

# Baseline rendering (dynamic layers applied by Rust profile-manager — see src-tauri/src/player/)
gpu-api=auto
profile=high-quality
vo=gpu-next
vd-queue-enable=no
target-prim=auto
target-trc=auto
target-contrast=auto
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=0
dither=fruit
dither-depth=10
temporal-dither=yes
temporal-dither-period=1
scale=spline36
cscale=lanczos
dscale=mitchell
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
sigmoid-upscaling=yes
linear-downscaling=no
correct-downscaling=yes

[sdr]
# live-action baseline — Rust applies HDR/tonemapping/shaders/audio/visual on top

[anime-sdr]
# anime baseline — shaders/VF applied dynamically per preset
