name: Tag release

# Builds the desktop app on every `v*` tag push and attaches the binaries
# to the tag's GitHub Release (issue #46). The Linux artifact is built
# from the repo flake via `nix build` (#56); Windows/macOS compile with
# deno on their native runners. First release has no prior tag:
# `gh release create --generate-notes` handles that server-side, so no
# previous-release lookup exists here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nix:
    name: Build Linux (nix)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check, lint, format
        run: |
          deno check scripts/desktop/main.ts
          deno lint scripts/desktop/main.ts
          deno fmt --check scripts/desktop/main.ts
      - uses: cachix/install-nix-action@v30
      - name: Build release binary with nix
        run: |
          nix build .#stremio-accru-release -o nix-out --print-build-logs
          mkdir -p dist
          cp nix-out/bin/stremio-accru-linux dist/stremio-accru-linux
      - name: Stage launcher
        run: cp scripts/stremio-linux.sh scripts/desktop/stremio-accru.desktop dist/
      - name: Pack tarball (linux)
        run: tar -czf stremio-accru-linux.tar.gz -C dist stremio-accru-linux stremio-linux.sh stremio-accru.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-accru-linux.tar.gz
          path: stremio-accru-linux.tar.gz

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: stremio-accru-windows.exe
            archive: stremio-accru-windows.zip
          - os: macos-latest
            bin: stremio-accru-macos
            archive: stremio-accru-macos.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check, lint, format
        run: |
          deno check scripts/desktop/main.ts
          deno lint scripts/desktop/main.ts
          deno fmt --check scripts/desktop/main.ts
      - name: Compile binary
        run: |
          mkdir -p dist
          deno compile \
            --allow-run --allow-net --allow-read --allow-env --allow-write \
            --output dist/${{ matrix.bin }} \
            scripts/desktop/main.ts
      - name: Stage launcher
        shell: bash
        run: cp scripts/stremio-linux.sh scripts/desktop/stremio-accru.desktop dist/
      - name: Pack zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.bin }}, dist/stremio-linux.sh, dist/stremio-accru.desktop -DestinationPath ${{ matrix.archive }}
      - name: Pack tarball (macos)
        if: runner.os == 'macOS'
        run: tar -czf ${{ matrix.archive }} -C dist ${{ matrix.bin }} stremio-linux.sh stremio-accru.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: [build-nix, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*
