name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: SvelteKit sync
        run: npx svelte-kit sync

      - name: Frontend build (Vite on Node)
        run: npm run build

      - name: Svelte check
        run: npm run check

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno fmt check
        run: deno fmt --check

      - name: Deno lint
        run: deno lint
